name: Update odds

# Regenerates the odds page from the latest nflverse results and publishes it
# to GitHub Pages. Nothing is committed back to the repo, so local clones never
# diverge; the published site is always built from master + live data.
on:
  schedule:
    - cron: "17 * * * *"      # hourly (GitHub may run it a few minutes late)
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regenerate odds
        run: python sports_elo.py --out _site/index.html --json _site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
